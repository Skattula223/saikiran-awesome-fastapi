<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Awesome FastAPI — Search</title>
<meta name="description" content="Searchable directory of the Awesome FastAPI curated list.">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="page-header">
  <h1>Awesome FastAPI</h1>
  <p class="subtitle">Searchable directory of the curated list — extensions, resources, hosting, and projects.</p>
  <a class="source-link" href="https://github.com/Skattula223/saikiran-awesome-fastapi" target="_blank" rel="noopener">View source & full README on GitHub →</a>
</header>

<main>
  <div class="controls">
    <input id="search" type="search" placeholder="Search by name or description…" aria-label="Search entries">
    <div id="chips" class="chips" role="group" aria-label="Filter by category"></div>
  </div>

  <p id="count" class="count"></p>
  <ul id="results" class="results"></ul>
  <p id="empty" class="empty" hidden>No matches. Try a different search term.</p>
</main>

<footer>
  <p>Generated from <code>data/awesome-fastapi.json</code> — data source of truth for both this site and the README.</p>
</footer>

<script src="app.js"></script>
</body>
</html>
