name: Data sync check

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  check-generated-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Verify README.md and site/data.json match data/awesome-fastapi.json
        run: python3 scripts/generate.py --check
